services:
  tube:
    build: .
    container_name: bog-music-tube
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    # Жёсткий потолок: даже при форк-бомбе yt-dlp контейнер не утащит хост
    # (на той же машине живут baza и VPN, и всего 1 CPU / ~960MB). cpus < 1
    # оставляет ядро остальным; pids-limit добивает форк-бомбу.
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 96
    environment:
      # Токен от @BotFather. Без него маршруты /tg/* отвечают 503, а поиск
      # по YouTube продолжает работать как раньше.
      BOG_MUSIC_TG_TOKEN: "${BOG_MUSIC_TG_TOKEN:-}"
      # Связки чат↔код и очередь метаданных. Байты треков тут не лежат:
      # файлы тянутся из Телеграма по file_id в момент запроса клиента.
      BOG_MUSIC_TG_STATE: /data/tg.json
      # last.fm: ключ приложения (last.fm/api/account/create) и session key
      # юзера держим здесь — подпись запроса требует секрет.
      BOG_MUSIC_FM_KEY: "${BOG_MUSIC_FM_KEY:-}"
      BOG_MUSIC_FM_SECRET: "${BOG_MUSIC_FM_SECRET:-}"
      BOG_MUSIC_FM_STATE: /data/fm.json
      # Публичный origin — сюда last.fm вернёт юзера после подтверждения.
      BOG_MUSIC_FM_BASE: "${BOG_MUSIC_FM_BASE:-https://tube.87.120.36.150.ip.giper.dev}"
    volumes:
      - state:/data
      # Бандл монтируем, а не запекаем в образ: на боксе диск под завязку, а
      # пересборка образа гоняет apt с ffmpeg на 200+МБ. Обновление кода =
      # scp node.js рядом с compose.yml + docker compose restart tube.
      # (В Dockerfile COPY node.js оставлен — на случай сборки с нуля.)
      - ./node.js:/app/node.js:ro

volumes:
  state:
